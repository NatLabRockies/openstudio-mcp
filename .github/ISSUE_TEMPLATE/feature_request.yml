name: Feature request
description: New tool, capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Title: plain description of the change. No bracketed prefixes.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why current tools don't cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Suggested tool / behavior. Name existing tools it extends or replaces.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
