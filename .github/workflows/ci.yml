name: ci

# Trigger on PRs (open + every push to the PR) and on pushes to long-lived
# branches only. Without the push branch filter, a push to a branch that has
# an open PR fires BOTH push and pull_request → every job runs twice.
on:
  push:
    branches: [main, develop]
    tags: ["*"]
  pull_request:

# Cancel superseded in-progress runs on rapid re-push (saves runner minutes).
# Note: this does NOT dedupe push vs pull_request — they use different
# github.ref values; the push branch filter above is what removes that dup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-build:
    # Validates Dockerfile.arm64 builds end-to-end and /var/oscli is populated
    # (without it, every measure-based MCP tool fails at runtime). Native arm64
    # runner — free on public repos, ~5-10x faster than QEMU on amd64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.arm64
          platforms: linux/arm64
          tags: openstudio-mcp:arm64
          load: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Sanity — openstudio CLI
        run: |
          docker run --rm openstudio-mcp:arm64 bash -lc '
            set -euo pipefail
            openstudio --version
            openstudio openstudio_version | grep -F "3.11.0"
          '

      - name: Sanity — /var/oscli gems installed
        run: |
          docker run --rm openstudio-mcp:arm64 bash -lc '
            set -euo pipefail
            test -f /var/oscli/Gemfile.lock
            test -f /var/oscli/Gemfile
            test -d /var/oscli/gems
            cd /var/oscli
            bundle list > /tmp/gems.txt
            cat /tmp/gems.txt
            grep -q openstudio-standards /tmp/gems.txt
            grep -q openstudio-extension /tmp/gems.txt
            grep -q openstudio-workflow  /tmp/gems.txt
            grep -q openstudio-gems      /tmp/gems.txt
          '

      - name: Sanity — measure dirs from tarballs
        run: |
          docker run --rm openstudio-mcp:arm64 bash -lc '
            set -euo pipefail
            test -d /opt/comstock-measures
            test -d /opt/common-measures
            # at least one measure.rb in each (-quit avoids SIGPIPE under pipefail)
            test -n "$(find /opt/comstock-measures -name measure.rb -print -quit)"
            test -n "$(find /opt/common-measures   -name measure.rb -print -quit)"
          '

      - name: Sanity — python openstudio binding
        run: |
          docker run --rm openstudio-mcp:arm64 bash -lc '
            set -euo pipefail
            python -c "import openstudio; v = openstudio.openStudioVersion(); print(v); assert v == \"3.11.0\", v"
          '

      - name: Sanity — mcp_server imports
        run: |
          docker run --rm openstudio-mcp:arm64 bash -lc '
            set -euo pipefail
            python -c "from mcp_server.server import main; print(\"main:\", main)"
          '

      - name: Sanity — unit tests
        run: |
          mkdir -p runs
          docker run --rm \
            -v "$PWD:/repo" -v "$PWD/runs:/runs" \
            openstudio-mcp:arm64 \
            bash -lc 'cd /repo && pytest -vv -m "not integration" --timeout=60'

      - name: Save Docker image (arm64)
        run: docker save openstudio-mcp:arm64 | gzip > /tmp/image-arm64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image-arm64
          path: /tmp/image-arm64.tar.gz
          retention-days: 1

  arm64-test:
    # arm64 test matrix: shard 1 = real EnergyPlus sim via SEB4 OSW (asserts EUI
    # ≈ 1.875 ± 2%) + weather/loops; shard 2 = the arch-sensitive set (SWIG/stdout
    # deb-vs-wheel, measure exec/bundler, an HVAC sim). Both run confined (auto).
    needs: arm64-build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image-arm64
          path: /tmp

      - name: Load Docker image (arm64)
        run: docker load < /tmp/image-arm64.tar.gz

      - name: Run tests (arm64 shard ${{ matrix.shard }})
        env:
          RUN_OPENSTUDIO_INTEGRATION: "1"
          MCP_SERVER_CMD: "openstudio-mcp"
          # Run the integration suite confined (explicit, not via the code default).
          # Measures/sims drop to the unprivileged sandbox uid + Landlock + seccomp.
          OSMCP_SANDBOX: "auto"
        run: |
          mkdir -p runs
          case ${{ matrix.shard }} in
            1)
              # Mirrors amd64 shard 1: SEB4 sim + component/weather + loop ops + skill_retrofit
              FILES="tests/test_example_workflows.py tests/test_component_properties.py tests/test_comstock.py tests/test_weather.py tests/test_weather_files.py tests/test_mcp_seb4.py tests/test_create_constructions.py tests/test_loop_operations.py tests/test_plant_loop_demand.py tests/test_sizing_properties.py tests/test_skill_retrofit.py tests/test_integration.py"
              EXTRA_ENV="-e MCP_OSW_PATH=tests/assets/SEB_model/SEB4_baseboard/workflow.osw -e EXPECTED_EUI=1.8750760248144998 -e EXPECTED_EUI_RTOL=0.02 -e EXPECTED_EUI_ATOL=0.0"
              ;;
            2)
              # arm64 arch-sensitive coverage (the deb-vs-wheel / native-ISA risks):
              #  - SWIG memleak + stdout suppression (wheel-vs-deb behaviour)
              #  - measure apply + authoring (Ruby/Python exec + bundler on arm64)
              #  - an HVAC EnergyPlus sim (arm64 E+ build correctness)
              # (The sandbox/security PoC runs on arm64 via the security workflow.)
              FILES="tests/test_swig_memleak_cleanup.py tests/test_stdout_logger_silence.py tests/test_measures.py tests/test_measure_authoring.py tests/test_hvac_supply_sim.py"
              EXTRA_ENV=""
              ;;
          esac
          docker run --rm \
            -v "$PWD:/repo" -v "$PWD/runs:/runs" \
            -e RUN_OPENSTUDIO_INTEGRATION -e MCP_SERVER_CMD -e OSMCP_SANDBOX \
            $EXTRA_ENV \
            openstudio-mcp:arm64 bash -lc "cd /repo && pytest -vv -s $FILES"

  build:
    needs: arm64-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image-arm64
          path: /tmp

      - name: Load Docker image (arm64)
        run: docker load < /tmp/image-arm64.tar.gz

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: openstudio-mcp:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          mkdir -p runs
          docker run --rm -v "$PWD:/repo" -v "$PWD/runs:/runs" openstudio-mcp:dev bash -lc 'cd /repo && pytest -vv -m "not integration"'

      - name: Save Docker image
        run: docker save openstudio-mcp:dev | gzip > /tmp/image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: 1

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        env:
          IMAGE: nrel/openstudio-mcp
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"

          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            PUSH_TAG="dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            PUSH_TAG="prod"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PUSH_TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "Ref '${GITHUB_REF}' is not configured for Docker push."
            exit 0
          fi

          AMD64_TAG="${PUSH_TAG}-amd64"
          ARM64_TAG="${PUSH_TAG}-arm64"

          docker tag openstudio-mcp:dev "${IMAGE}:${AMD64_TAG}"
          docker tag openstudio-mcp:arm64 "${IMAGE}:${ARM64_TAG}"

          docker push "${IMAGE}:${AMD64_TAG}"
          docker push "${IMAGE}:${ARM64_TAG}"

          docker manifest rm "${IMAGE}:${PUSH_TAG}" >/dev/null 2>&1 || true
          docker manifest create "${IMAGE}:${PUSH_TAG}" \
            --amend "${IMAGE}:${AMD64_TAG}" \
            --amend "${IMAGE}:${ARM64_TAG}"
          docker manifest annotate "${IMAGE}:${PUSH_TAG}" "${IMAGE}:${AMD64_TAG}" --arch amd64 --os linux
          docker manifest annotate "${IMAGE}:${PUSH_TAG}" "${IMAGE}:${ARM64_TAG}" --arch arm64 --os linux
          docker manifest push "${IMAGE}:${PUSH_TAG}"

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/image.tar.gz

      - name: Run tests (shard ${{ matrix.shard }})
        env:
          RUN_OPENSTUDIO_INTEGRATION: "1"
          MCP_SERVER_CMD: "openstudio-mcp"
          # Run the integration suite confined (explicit, not via the code default).
          # Measures/sims drop to the unprivileged sandbox uid + Landlock + seccomp.
          OSMCP_SANDBOX: "auto"
        run: |
          mkdir -p runs
          # Shard timings measured via `pytest --durations=0` on 2026-08-07 after the
          # gbXML climate-zone/roof-repair work landed (see runs/shard_timing_full.log
          # for the raw per-test breakdown). Two tests inside test_gbxml_import.py
          # (test_..._stat_file_on_austin_fixture ~233s local / ~300s on runners,
          # test_..._wmo_lookup... ~213s)
          # alone rivaled the runtime of an entire shard, so they're pulled out by
          # node ID into shards 2/3 below rather than moving the whole file, which
          # would just relocate the imbalance. All 5 shards land within ~50s of each
          # other (~795-850s) instead of the prior 613-1468s spread.
          # A third heavy gbXML test (test_geometry_repair_pipeline_on_austin_apartment_fixture,
          # ~230s local, added 2026-08-09 for merge_coplanar_sliver_surfaces, extended
          # 2026-08-10 to also cover weld_coincident_vertices — same fixture, no added
          # import cost) got the same node-ID treatment into shard 1, which had no gbXML
          # weight yet — but this was placed by inspection, not a fresh full-suite timing
          # run. Re-measure with `pytest --durations=0` next time shard balance is revisited.
          EXTRA_PYTEST_ARGS=""
          case ${{ matrix.shard }} in
            1)
              # sim test + component/weather + loop ops + skill_retrofit
              # + load/save model & file listing tools (moved from shard 4 to balance runtime)
              # + merge_coplanar_sliver_surfaces real-fixture regression (moved from shard 4, see timing note above)
              FILES="tests/test_example_workflows.py tests/test_component_properties.py tests/test_comstock.py tests/test_weather.py tests/test_weather_files.py tests/test_mcp_seb4.py tests/test_create_constructions.py tests/test_loop_operations.py tests/test_plant_loop_demand.py tests/test_sizing_properties.py tests/test_skill_retrofit.py tests/test_integration.py tests/test_load_save_model.py tests/test_gbxml_import.py::test_geometry_repair_pipeline_on_austin_apartment_fixture"
              EXTRA_ENV="-e MCP_OSW_PATH=tests/assets/SEB_model/SEB4_baseboard/workflow.osw -e EXPECTED_EUI=1.8750760248144998 -e EXPECTED_EUI_RTOL=0.02 -e EXPECTED_EUI_ATOL=0.0"
              ;;
            2)
              # common_measures, hvac_systems, geometry, zone terminal, skill_energy_report
              # + remote HTTP transport, session isolation, token auth & session eviction (no-sim, fast)
              # + measure discovery/BCL download + per-tenant measures isolation (HTTP)
              # + python_ems (plugin templates, actuator discovery, plugin sims)
              # + outcome grader (LLM benchmark gate-2 ground truth, ~7s)
              # + gbXML .stat-file climate-zone resolution test (moved from shard 4 to balance runtime)
              FILES="tests/test_common_measures.py tests/test_hvac_systems.py tests/test_replace_zone_terminal.py tests/test_geometry.py tests/test_skill_energy_report.py tests/test_http_transport.py tests/test_session_isolation.py tests/test_auth.py tests/test_session_eviction.py tests/test_file_transfer.py tests/test_measure_discovery.py tests/test_python_ems.py tests/test_knowledge_ablation.py tests/test_outcome_grader_integration.py tests/test_gbxml_import.py::test_import_gbxml_resolves_climate_zone_from_stat_file_on_austin_fixture"
              EXTRA_ENV=""
              ;;
            3)
              # controls, object mgmt, loads, building, doas, hvac, measures, measure_authoring, skill_qaqc, hvac_supply_wiring
              # + gbXML WMO-fallback climate-zone test (moved from shard 4 to balance runtime)
              # + paired-vertex sync, ground-contact, and gbXML import-timeout checks (in-process,
              #   no sim — measured at ~15s, ~2s and ~43s, so shard balance is unaffected wherever
              #   they land; placed here rather than with test_geometry.py in shard 2, which
              #   already carries more)
              FILES="tests/test_component_controls.py tests/test_object_management.py tests/test_generic_access.py tests/test_create_loads.py tests/test_building.py tests/test_doas_system.py tests/test_hvac.py tests/test_measures.py tests/test_measure_authoring.py tests/test_skill_qaqc.py tests/test_hvac_supply_wiring.py tests/test_validate_model.py tests/test_api_reference.py tests/test_paired_vertex_sync.py tests/test_ground_contact.py tests/test_gbxml_import_timeout.py tests/test_trim_order_invariance.py tests/test_patch_construction_choice.py tests/test_gbxml_import.py::test_import_gbxml_falls_back_to_wmo_lookup_when_stat_file_unusable"
              EXTRA_ENV=""
              ;;
            4)
              # vrf, radiant, query skills, creation, air terminals, results extraction
              # + gbxml_import (Revit gbXML -> OSM via gbxml-to-openstudio measures), minus its
              # three heaviest tests (see the timing note above shard 1) which run in shards 1/2/3
              # + validate_osw/run_osw file_paths resolution (issue #99)
              # + add_layer_to_construction (F7 insulation-upgrade affordance)
              FILES="tests/test_vrf_system.py tests/test_radiant_system.py tests/test_loads.py tests/test_spaces.py tests/test_space_types.py tests/test_schedules.py tests/test_constructions.py tests/test_add_layer_construction.py tests/test_create_space.py tests/test_create_thermal_zone.py tests/test_add_air_loop.py tests/test_create_schedule_ruleset.py tests/test_add_output_variable.py tests/test_add_output_meter.py tests/test_versions.py tests/test_create_example_osm.py tests/test_inspect_osm_summary.py tests/test_copy_file.py tests/test_replace_air_terminals.py tests/test_results_extraction.py tests/test_swig_memleak_cleanup.py tests/test_skill_tools_integration.py tests/test_stdio_smoke.py tests/test_response_sizes.py tests/test_response_guard.py tests/test_gbxml_import.py tests/test_space_type_assignment.py tests/test_validate_osw.py"
              EXTRA_ENV=""
              EXTRA_PYTEST_ARGS="--deselect tests/test_gbxml_import.py::test_import_gbxml_resolves_climate_zone_from_stat_file_on_austin_fixture --deselect tests/test_gbxml_import.py::test_import_gbxml_falls_back_to_wmo_lookup_when_stat_file_unusable --deselect tests/test_gbxml_import.py::test_geometry_repair_pipeline_on_austin_apartment_fixture"
              ;;
            5)
              # HVAC supply sim smoke tests + hvac_validation + bar_building + concurrent regression
              # + sim queue (concurrency cap) & per-user run-dir isolation + run retention/cleanup
              # + python_ems phase 2 (packages/numpy-in-plugin, edit, node reset, trend)
              # + generic HVAC template comfort benchmark (issue #97)
              # + weather fail-fast + failed-run extraction guard
              # + hvac_only standards swap parity benchmark (issue #97, moved from shard 4 to balance runtime)
              FILES="tests/test_hvac_supply_sim.py tests/test_hvac_validation.py tests/test_bar_building.py tests/test_concurrent_tools.py tests/test_stdout_logger_silence.py tests/test_sim_queue.py tests/test_per_user_run_dirs.py tests/test_audit_log.py tests/test_retention.py tests/test_python_ems_phase2.py tests/test_generic_hvac_comfort.py tests/test_hvac_only_swap.py tests/test_run_simulation_weather_guard.py"
              EXTRA_ENV=""
              ;;
          esac
          docker run --rm \
            -v "$PWD:/repo" -v "$PWD/runs:/runs" \
            -e RUN_OPENSTUDIO_INTEGRATION -e MCP_SERVER_CMD -e OSMCP_SANDBOX \
            $EXTRA_ENV \
            openstudio-mcp:dev bash -lc "cd /repo && pytest -vv -s $FILES $EXTRA_PYTEST_ARGS"
